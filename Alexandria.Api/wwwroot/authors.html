<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexandria - Authors</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles/bootstrap.min.css">
    <link rel="stylesheet" href="styles/kobo.css">
    <link rel="stylesheet" href="styles/glightbox.min.css">
</head>
<body>
<!-- Top Bar -->
<div class="top-bar-outer">
<header class="top-bar container-lg">
    <span class="top-bar-clock" id="clock">00:00</span>
    <a href="index.html" class="top-bar-logo">Alexandria</a>
    <div class="top-bar-icons">
        <button id="theme-toggle" title="Toggle dark mode">
            <svg id="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg id="theme-icon-moon" class="d-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
        <button id="sync-btn" title="Sync">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10"/><path d="M20.49 15a9 9 0 01-14.85 3.36L1 14"/></svg>
        </button>
        <button id="search-btn" title="Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
    </div>
</header>
</div>

<div class="page container-lg">
    <!-- Tab Bar -->
    <ul class="nav nav-underline mb-2">
        <li class="nav-item"><a class="nav-link" href="books.html">Books</a></li>
        <li class="nav-item"><a class="nav-link active" href="authors.html">Authors</a></li>
        <li class="nav-item"><a class="nav-link" href="series.html">Series</a></li>
        <li class="nav-item"><a class="nav-link" href="collections.html">Collections</a></li>
    </ul>

    <!-- Toolbar -->
    <div class="toolbar">
        <div class="dropdown" id="authors-sort-dropdown" data-page-key="authors">
            <button class="dropdown-toggle" data-bs-toggle="dropdown" data-label="Sort: ">Sort: Last name</button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#" data-sort="LastName" data-default-order="Asc" data-value="Last name"><span class="check">&#10003;</span> Last name</a></li>
                <li><a class="dropdown-item" href="#" data-sort="FirstName" data-default-order="Asc" data-value="First name"><span class="check"></span> First name</a></li>
                <li><a class="dropdown-item" href="#" data-sort="Recent" data-default-order="Desc" data-value="Recent"><span class="check"></span> Recent</a></li>
                <li><a class="dropdown-item" href="#" data-sort="NumberOfBooks" data-default-order="Desc" data-value="Number of books"><span class="check"></span> Number of books</a></li>
            </ul>
        </div>
    </div>

    <!-- Author List -->
    <div class="list-group list-group-flush" id="author-list"></div>


</div>

<!-- Bottom Navigation -->
<div class="bottom-nav-outer">
<nav class="bottom-nav container-lg">
    <a href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
        <span>Home</span>
    </a>
    <a href="books.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h5l3 3h8v13H4z"/></svg>
        <span>My Books</span>
    </a>
    <a href="more.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        <span>More</span>
    </a>
</nav>
</div>

<script src="scripts/jquery.js"></script>
<script src="scripts/bootstrap.bundle.min.js"></script>
<script src="scripts/glightbox.min.js"></script>
<script src="scripts/helpers.js"></script>
<script src="scripts/sort-filter.js"></script>
<script src="scripts/render-books.js"></script>
<script src="scripts/book-modal.js"></script>
<script src="scripts/edit-modal.js"></script>
<script src="scripts/sync.js"></script>
<script src="scripts/search.js"></script>
<script src="scripts/app.js"></script>
<script>
$(function () {
    var sortPrefs = getSortPrefs("authors", "LastName", "Asc");
    restoreSortDropdown($("#authors-sort-dropdown"), sortPrefs.sort, sortPrefs.order);

    function loadAuthors() {
        var prefs = getSortPrefs("authors", "LastName", "Asc");
        $.get("/api/alexandria/authors?sort=" + prefs.sort + "&order=" + prefs.order, function (authors) {
            var $list = $("#author-list").empty();
            $.each(authors, function (i, author) {
                var count = (author.books || []).length;
                $list.append(
                    '<a href="author-detail.html?name=' + encodeURIComponent(author.name) + '" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center px-0">' +
                        '<span class="fw-semibold text-body">' + escapeHtml(author.name) + '</span>' +
                        '<span class="text-body-secondary">' + count + (count === 1 ? ' book' : ' books') + '</span>' +
                    '</a>'
                );
            });
        });
    }

    pageReload = loadAuthors;
    loadAuthors();
});
</script>
</body>
</html>
