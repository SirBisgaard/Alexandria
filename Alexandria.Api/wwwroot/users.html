<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexandria - Users</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles/bootstrap.min.css">
    <link rel="stylesheet" href="styles/kobo.css">
    <link rel="stylesheet" href="styles/glightbox.min.css">
</head>
<body>
<!-- Top Bar -->
<div class="top-bar-outer">
<header class="top-bar container-lg">
    <span class="top-bar-clock" id="clock">00:00</span>
    <a href="index.html" class="top-bar-logo">Alexandria</a>
    <div class="top-bar-icons">
        <button id="theme-toggle" title="Toggle dark mode">
            <svg id="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg id="theme-icon-moon" class="d-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
        <button id="sync-btn" title="Sync">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10"/><path d="M20.49 15a9 9 0 01-14.85 3.36L1 14"/></svg>
        </button>
        <button id="search-btn" title="Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
    </div>
</header>
</div>

<div class="page container-lg">
    <!-- Toolbar -->
    <div class="toolbar">
        <span class="toolbar-title">Users</span>
        <div class="flex-grow-1"></div>
        <div class="dropdown">
            <button class="btn btn-outline-secondary btn-sm rounded-circle" data-bs-toggle="dropdown">&middot;&middot;&middot;</button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="#" id="add-user-btn">Add User</a></li>
            </ul>
        </div>
    </div>

    <div id="users-list" class="admin-list"></div>
</div>

<!-- User Modal -->
<div class="book-modal-backdrop" id="user-modal-backdrop">
    <div class="book-modal" id="user-modal">
        <div class="book-modal-title-bar" id="user-modal-title">Add User</div>
        <button class="book-modal-close" id="user-modal-close">&times;</button>
        <div class="book-modal-info" style="padding: 16px;">
            <form id="user-form">
                <input type="hidden" id="user-uuid">
                <div class="login-field">
                    <label for="user-username">Username</label>
                    <input type="text" id="user-username" class="bm-edit-input" autocomplete="off">
                </div>
                <div class="login-field">
                    <label for="user-password">Password</label>
                    <input type="password" id="user-password" class="bm-edit-input" autocomplete="new-password">
                    <div class="settings-tile-desc user-password-hint d-none">Leave blank to keep current password.</div>
                </div>
                <div class="login-field">
                    <label for="user-displayname">Display Name</label>
                    <input type="text" id="user-displayname" class="bm-edit-input">
                </div>
                <div class="login-error" id="user-error"></div>
                <div class="admin-modal-actions">
                    <button type="submit" class="bm-edit-btn bm-edit-btn-primary" id="user-save-btn">Save</button>
                    <button type="button" class="bm-edit-btn" id="user-cancel-btn">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bottom Navigation -->
<div class="bottom-nav-outer">
<nav class="bottom-nav container-lg">
    <a href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
        <span>Home</span>
    </a>
    <a href="books.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h5l3 3h8v13H4z"/></svg>
        <span>My Books</span>
    </a>
    <a href="more.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        <span>More</span>
    </a>
</nav>
</div>

<script src="scripts/jquery.js"></script>
<script src="scripts/auth.js"></script>
<script src="scripts/bootstrap.bundle.min.js"></script>
<script src="scripts/glightbox.min.js"></script>
<script src="scripts/helpers.js"></script>
<script src="scripts/sort-filter.js"></script>
<script src="scripts/render-books.js"></script>
<script src="scripts/book-modal.js"></script>
<script src="scripts/edit-modal.js"></script>
<script src="scripts/sync.js"></script>
<script src="scripts/search.js"></script>
<script src="scripts/settings-modal.js"></script>
<script src="scripts/users.js"></script>
<script src="scripts/app.js"></script>
</body>
</html>
