<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexandria</title>
    <link rel="stylesheet" href="styles/bootstrap.min.css">
    <link rel="stylesheet" href="styles/kobo.css">
</head>
<body>
<!-- Top Bar -->
<div class="top-bar-outer">
<header class="top-bar">
    <span class="top-bar-clock" id="clock">00:00</span>
    <a href="index.html" class="top-bar-logo">Alexandria</a>
    <div class="top-bar-icons">
        <button id="theme-toggle" title="Toggle dark mode">
            <svg id="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg id="theme-icon-moon" class="d-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
        <button id="sync-btn" title="Sync">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10"/><path d="M20.49 15a9 9 0 01-14.85 3.36L1 14"/></svg>
        </button>
        <button id="search-btn" title="Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
    </div>
</header>
</div>

<div class="page">
    <div class="home-grid" id="home-grid"></div>
</div>

<!-- Bottom Navigation -->
<div class="bottom-nav-outer">
<nav class="bottom-nav">
    <a href="index.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
        <span>Home</span>
    </a>
    <a href="books.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h5l3 3h8v13H4z"/></svg>
        <span>My Books</span>
    </a>
    <a href="more.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        <span>More</span>
    </a>
</nav>
</div>

<script src="scripts/jquery.js"></script>
<script src="scripts/bootstrap.bundle.min.js"></script>
<script src="scripts/kobo.js"></script>
<script>
$(function () {
    $.when(
        $.get("/api/alexandria/books"),
        $.get("/api/alexandria/collections"),
        $.get("/api/alexandria/series?sort=Recent&order=Desc")
    ).done(function (booksResult, collectionsResult, seriesResult) {
        var books = booksResult[0];
        var collections = collectionsResult[0];
        var seriesList = seriesResult[0];
        var $grid = $("#home-grid");

        // Currently reading
        var reading = null;
        for (var i = 0; i < books.length; i++) {
            var p = books[i].readingProgress;
            if (p && p.progressPercent != null && p.status !== "ReadyToRead") {
                reading = books[i];
                break;
            }
        }
        if (reading) {
            var pct = Math.round(reading.readingProgress.progressPercent);
            var remaining = reading.readingProgress.remainingTimeMinutes;
            var subText = remaining ? Math.round(remaining / 60) + " hours to go" : "";
            $grid.append(
                '<div class="home-card" style="cursor:pointer" onclick="openBookModal(\'' + reading.uuid + '\')">' +
                    '<div class="home-card-covers">' +
                        homeSingleCoverHtml(reading) +
                    '</div>' +
                    '<div class="home-card-title">' + pct + '% Read</div>' +
                    '<div class="home-card-sub">' + escapeHtml(subText) + '</div>' +
                '</div>'
            );
        }

        // Author spotlight — author with most unread books
        var authorMap = {};
        $.each(books, function (i, b) {
            $.each(b.authors || [], function (j, a) {
                if (!authorMap[a]) { authorMap[a] = []; }
                authorMap[a].push(b);
            });
        });
        var topAuthor = null;
        var topCount = 0;
        $.each(authorMap, function (name, authorBooks) {
            var unread = 0;
            $.each(authorBooks, function (i, b) {
                if (!b.readingProgress || b.readingProgress.status === "ReadyToRead") { unread++; }
            });
            if (unread > topCount) { topCount = unread; topAuthor = name; }
        });
        if (topAuthor) {
            var aBooks = authorMap[topAuthor].slice(0, 3);
            var stackHtml = '<div class="home-card-covers"><div class="home-card-cover-stack">';
            $.each(aBooks, function (i, b) {
                stackHtml += homeStackCoverHtml(b);
            });
            stackHtml += '</div></div>';
            $grid.append(
                '<a href="author-detail.html?name=' + encodeURIComponent(topAuthor) + '" class="home-card">' + stackHtml +
                    '<div class="home-card-title">' + escapeHtml(topAuthor) + '</div>' +
                    '<div class="home-card-sub">' + topCount + ' unread books</div>' +
                '</a>'
            );
        }

        // My Books
        var firstThree = books.slice(0, 3);
        var myBooksStack = '<div class="home-card-covers"><div class="home-card-cover-stack">';
        $.each(firstThree, function (i, b) {
            myBooksStack += homeStackCoverHtml(b);
        });
        myBooksStack += '</div></div>';
        $grid.append(
            '<a href="books.html" class="home-card">' + myBooksStack +
                '<div class="home-card-title">My Books</div>' +
                '<div class="home-card-sub">' + books.length + ' books</div>' +
            '</a>'
        );

        // First collection
        if (collections.length > 0) {
            var col = collections[0];
            var colUuids = col.bookUuids || [];
            var colCount = colUuids.length;
            var bookMap = {};
            $.each(books, function (i, b) { bookMap[b.uuid] = b; });
            var colCovers = '<div class="home-card-covers"><div class="home-card-cover-stack">';
            var shown = 0;
            for (var ci = 0; ci < colUuids.length && shown < 3; ci++) {
                if (bookMap[colUuids[ci]]) {
                    colCovers += homeStackCoverHtml(bookMap[colUuids[ci]]);
                    shown++;
                }
            }
            colCovers += '</div></div>';
            $grid.append(
                '<a href="collection-detail.html?uuid=' + col.uuid + '" class="home-card">' +
                    colCovers +
                    '<div class="home-card-title">' + escapeHtml(col.name) + '</div>' +
                    '<div class="home-card-sub">' + colCount + (colCount === 1 ? ' book' : ' books') + '</div>' +
                '</a>'
            );
        }

        // Latest series
        if (seriesList.length > 0) {
            var latestSeries = seriesList[0];
            var sBooks = (latestSeries.books || []).slice(0, 3);
            var sStack = '<div class="home-card-covers"><div class="home-card-cover-stack">';
            $.each(sBooks, function (i, b) {
                sStack += homeStackCoverHtml(b);
            });
            sStack += '</div></div>';
            var sCount = (latestSeries.books || []).length;
            $grid.append(
                '<a href="series-detail.html?uuid=' + latestSeries.uuid + '" class="home-card">' + sStack +
                    '<div class="home-card-title">' + escapeHtml(latestSeries.name) + '</div>' +
                    '<div class="home-card-sub">' + sCount + (sCount === 1 ? ' book' : ' books') + '</div>' +
                '</a>'
            );
        }
    });
});
</script>
</body>
</html>
