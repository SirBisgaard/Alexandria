<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexandria - Login</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles/bootstrap.min.css">
    <link rel="stylesheet" href="styles/kobo.css">
</head>
<body>
<!-- Top Bar -->
<div class="top-bar-outer">
<header class="top-bar container-lg">
    <span class="top-bar-clock" id="clock">00:00</span>
    <a href="login.html" class="top-bar-logo">Alexandria</a>
    <div class="top-bar-icons">
        <button id="theme-toggle" title="Toggle dark mode">
            <svg id="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg id="theme-icon-moon" class="d-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
    </div>
</header>
</div>

<div class="login-page mt-5">
    <div class="login-card">
        <form id="login-form" autocomplete="on">
            <div class="login-field">
                <label for="login-username">Username</label>
                <input type="text" id="login-username" class="bm-edit-input" autocomplete="username" autofocus>
            </div>
            <div class="login-field">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" class="bm-edit-input" autocomplete="current-password">
            </div>
            <div class="login-error" id="login-error"></div>
            <button type="submit" class="bm-edit-btn bm-edit-btn-primary login-btn">Sign in</button>
        </form>
    </div>
</div>

<script src="scripts/jquery.js"></script>
<script>
$(function () {
    // Theme toggle (standalone, no app.js)
    var theme = localStorage.getItem("theme") || "light";
    $("html").attr("data-bs-theme", theme);
    if (theme === "dark") { $("#theme-icon-sun").addClass("d-none"); $("#theme-icon-moon").removeClass("d-none"); }
    $("#theme-toggle").on("click", function () {
        theme = theme === "light" ? "dark" : "light";
        $("html").attr("data-bs-theme", theme);
        localStorage.setItem("theme", theme);
        $("#theme-icon-sun").toggleClass("d-none");
        $("#theme-icon-moon").toggleClass("d-none");
    });

    // Clock
    function updateClock() { var d = new Date(); $("#clock").text(("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)); }
    updateClock(); setInterval(updateClock, 10000);

    // If already logged in, redirect. login.html doesn't load auth.js, so attach the header inline.
    var existingToken = localStorage.getItem("alexandria-token");
    if (existingToken) {
        $.ajax({
            url: "/api/alexandria/auth/me",
            headers: { "Authorization": "Bearer " + existingToken },
            success: function () { window.location.href = "/index.html"; },
            error: function () { localStorage.removeItem("alexandria-token"); }
        });
    }

    $("#login-form").on("submit", function (e) {
        e.preventDefault();
        $("#login-error").text("");
        $(".login-btn").prop("disabled", true).text("Signing in...");

        $.ajax({
            url: "/api/alexandria/auth/login",
            method: "POST",
            contentType: "application/json",
            data: JSON.stringify({
                username: $("#login-username").val(),
                password: $("#login-password").val()
            }),
            success: function (data) {
                localStorage.setItem("alexandria-token", data.token);
                window.location.href = "/index.html";
            },
            error: function (jqXHR) {
                var msg = "Login failed";
                if (jqXHR.responseJSON && jqXHR.responseJSON.error)
                    msg = jqXHR.responseJSON.error;
                $("#login-error").text(msg);
                $(".login-btn").prop("disabled", false).text("Sign in");
            }
        });
    });
});
</script>
</body>
</html>
