<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexandria - Books</title>
    <link rel="stylesheet" href="styles/bootstrap.min.css">
    <link rel="stylesheet" href="styles/kobo.css">
</head>
<body>
<!-- Top Bar -->
<div class="top-bar-outer">
<header class="top-bar">
    <span class="top-bar-clock" id="clock">00:00</span>
    <span class="top-bar-logo">Alexandria</span>
    <div class="top-bar-icons">
        <button id="theme-toggle" title="Toggle dark mode">
            <svg id="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg id="theme-icon-moon" class="d-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
        <button id="sync-btn" title="Sync">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10"/><path d="M20.49 15a9 9 0 01-14.85 3.36L1 14"/></svg>
        </button>
        <button id="search-btn" title="Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
    </div>
</header>
</div>

<div class="page">
    <!-- Tab Bar -->
    <ul class="nav nav-underline mb-2">
        <li class="nav-item"><a class="nav-link active" href="books.html">Books</a></li>
        <li class="nav-item"><a class="nav-link" href="authors.html">Authors</a></li>
        <li class="nav-item"><a class="nav-link" href="series.html">Series</a></li>
        <li class="nav-item"><a class="nav-link" href="collections.html">Collections</a></li>
    </ul>

    <!-- Toolbar -->
    <div class="toolbar">
        <div class="dropdown" data-page-key="books">
            <button class="dropdown-toggle" data-bs-toggle="dropdown" data-label="Filter: ">Filter: All</button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#" data-filter="all" data-value="All"><span class="check">&#10003;</span> All</a></li>
                <li><a class="dropdown-item" href="#" data-filter="unread" data-value="Unread"><span class="check"></span> Unread</a></li>
                <li><a class="dropdown-item" href="#" data-filter="reading" data-value="Reading"><span class="check"></span> Reading</a></li>
            </ul>
        </div>
        <div class="dropdown" id="books-sort-dropdown" data-page-key="books">
            <button class="dropdown-toggle" data-bs-toggle="dropdown" data-label="Sort: ">Sort: Recent</button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#" data-sort="Recent" data-default-order="Desc" data-value="Recent"><span class="check">&#10003;</span> Recent</a></li>
                <li><a class="dropdown-item" href="#" data-sort="DateAdded" data-default-order="Desc" data-value="Date added"><span class="check"></span> Date added</a></li>
                <li><a class="dropdown-item" href="#" data-sort="Title" data-default-order="Asc" data-value="Title"><span class="check"></span> Title</a></li>
                <li><a class="dropdown-item" href="#" data-sort="Author" data-default-order="Asc" data-value="Author"><span class="check"></span> Author</a></li>
                <li><a class="dropdown-item" href="#" data-sort="Series" data-default-order="Asc" data-value="Series"><span class="check"></span> Series</a></li>
                <li><a class="dropdown-item" href="#" data-sort="FileSize" data-default-order="Desc" data-value="File size"><span class="check"></span> File size</a></li>
            </ul>
        </div>
        <div class="flex-grow-1"></div>
        <div class="dropdown">
            <button class="btn btn-outline-secondary btn-sm rounded-circle" data-bs-toggle="dropdown">&middot;&middot;&middot;</button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="#" data-view-toggle="grid">Grid view</a></li>
                <li><a class="dropdown-item" href="#" data-view-toggle="list">List view</a></li>
            </ul>
        </div>
    </div>

    <!-- Grid View -->
    <div class="book-grid view-grid-container" id="book-grid"></div>

    <!-- List View -->
    <div class="view-list-container d-none" id="book-list"></div>


</div>

<!-- Bottom Navigation -->
<nav class="bottom-nav">
    <a href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
        <span>Home</span>
    </a>
    <a href="books.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h5l3 3h8v13H4z"/></svg>
        <span>My Books</span>
    </a>
    <a href="more.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        <span>More</span>
    </a>
</nav>

<script src="scripts/jquery.js"></script>
<script src="scripts/bootstrap.bundle.min.js"></script>
<script src="scripts/kobo.js"></script>
<script>
$(function () {
    var sortPrefs = getSortPrefs("books", "Recent", "Desc");
    var filterPref = getFilterPref("books", "all");
    restoreSortDropdown($("#books-sort-dropdown"), sortPrefs.sort, sortPrefs.order);
    restoreFilterDropdown($("[data-page-key='books']").first(), filterPref);

    function loadBooks() {
        var prefs = getSortPrefs("books", "Recent", "Desc");
        var filter = getFilterPref("books", "all");
        $.get("/api/alexandria/books?sort=" + prefs.sort + "&order=" + prefs.order, function (books) {
            if (filter === "unread") {
                books = books.filter(function (b) { return !b.readingProgress || b.readingProgress.status === "ReadyToRead"; });
            } else if (filter === "reading") {
                books = books.filter(function (b) { return b.readingProgress && b.readingProgress.status !== "ReadyToRead"; });
            }
            renderBooks(books);
        });
    }

    function renderBooks(books) {
        var $grid = $("#book-grid").empty();
        var $list = $("#book-list").empty();
        $.each(books, function (i, book) {
            var status = readingStatusText(book.readingProgress);
            var authors = (book.authors || []).join(", ");
            var series = book.seriesName ? (book.seriesName.toUpperCase() + (book.seriesIndex ? " - " + book.seriesIndex : "")) : "";

            $grid.append(
                '<div class="book-card">' +
                    bookCoverHtml(book, "book-cover-img") +
                    '<div class="book-status">' + escapeHtml(status) + '</div>' +
                    '<div class="book-menu">&middot;&middot;&middot;</div>' +
                '</div>'
            );

            $list.append(
                '<div class="book-list-item">' +
                    '<img src="' + coverUrl(book.uuid) + '" class="book-list-cover-img" alt="" onerror="this.style.display=\'none\'">' +
                    '<div class="book-list-info">' +
                        '<div class="book-list-title">' + escapeHtml(book.title) + '</div>' +
                        '<div class="book-list-series">' + escapeHtml(series) + '</div>' +
                        '<div class="book-list-author">' + escapeHtml(authors) + '</div>' +
                    '</div>' +
                    '<div class="book-list-right">' +
                        '<div class="book-list-read-status">' + escapeHtml(status) + '</div>' +
                        '<div class="book-list-format">KEPUB - ' + formatFileSize(book.kepubFileSize) + '</div>' +
                        '<div class="book-menu">&middot;&middot;&middot;</div>' +
                    '</div>' +
                '</div>'
            );
        });
    }

    pageReload = loadBooks;
    loadBooks();
});
</script>
</body>
</html>
